apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: platform-prod

helmGlobals:
  chartHome: ../../../../charts

helmCharts:
  - name: microservice
    releaseName: payment-api
    namespace: platform-prod
    valuesInline:
      replicaCount: 3

      image:
        repository: example/payment-api
        tag: "1.0.0"

      resources:
        requests:
          cpu: 250m
          memory: 256Mi
        limits:
          cpu: 1000m
          memory: 512Mi