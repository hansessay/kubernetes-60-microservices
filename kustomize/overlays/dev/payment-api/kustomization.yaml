apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: platform-dev

helmGlobals:
  chartHome: ../../../../charts

helmCharts:
  - name: microservice
    releaseName: payment-api
    namespace: platform-dev
    valuesInline:
      replicaCount: 1
      image:
        repository: example/payment-api
        tag: "1.0.0"