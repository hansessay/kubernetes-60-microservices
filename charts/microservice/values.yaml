replicaCount: 1

image:
  repository: ""
  tag: "1.0.0"
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  automount: false

service:
  type: ClusterIP
  port: 8080

containerPort: 8080

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

probes:
  readiness:
    path: /readyz
  liveness:
    path: /healthz